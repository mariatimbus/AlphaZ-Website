<!--
  ============================================
  TEMPLATE VITE – punctul de pornire al aplicației
  ============================================
  Acest fișier NU este pagina finală. Este doar
  „scheletul” pe care Vite îl folosește la build
  pentru a genera site-ul complet în folderul dist/.

  Ce face fiecare parte:
  – <meta charset>       → caractere UTF-8 (diacritice, emoji etc.)
  – <meta viewport>      → scalare corectă pe telefoane
  – <link rel="icon">    → iconița din bara de browser
  – <link preconnect>    → conectare anticipată la Google Fonts
  – <link fonts>         → fonturile Audiowide și Lato
  – <div id="root">      → aici React montează toată aplicația
  – <script>             → încarcă fișierul principal React

  PENTRU PREVIZUALIZARE: deschide dist/index.html
  (acela e fișierul final, cu tot CSS+JS inline)
  ============================================
-->
<!doctype html>
<html lang="en">
  <head>
    <!-- Setări de bază -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Titlu pagină + favicon -->
    <title>AlphaZ #11141</title>
    <link rel="icon" type="image/png" href="/icon.png" />

    <meta name="description" content="AlphaZ #11141 - FIRST Robotics Competition team from Romania. Global performance, Romanian minds.">

    <!-- Preload critical above-fold assets -->
    <link rel="preload" as="image" href="/image/robot.webp" fetchpriority="high">
    <link rel="preload" as="image" href="/image/background_section1.png" fetchpriority="high">

    <!-- Fonturi Google: Audiowide (titluri) + Lato (text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/assets/main-BZ4IX5Qg.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/ContactFooter-DbMX9LzO.js">
    <link rel="stylesheet" crossorigin href="/assets/ContactFooter-Ca4I7juy.css">
  </head>

  <body>
    <script>
      if (window.location.pathname.endsWith('/index.html')) {
        window.location.replace(window.location.pathname.replace('/index.html', '/') + window.location.search + window.location.hash);
      }
    </script>
    <div id="root"></div>
  </body>
</html>
